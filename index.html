<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game" aria-labelledby="game-title">
      <header class="game-header">
        <h1 id="game-title">2048</h1>
        <div class="game-actions">
          <div class="score-box" aria-label="현재 점수">
            <span>점수</span>
            <strong id="score" aria-live="polite">0</strong>
          </div>
          <button id="new-game" class="primary-button" type="button">새 게임</button>
        </div>
      </header>

      <section id="board" class="board" role="grid" aria-label="2048 게임 보드"></section>

      <div class="direction-controls" aria-label="방향 조작">
        <button class="direction-button up" type="button" data-direction="up" aria-label="위로 이동">↑</button>
        <button class="direction-button left" type="button" data-direction="left" aria-label="왼쪽으로 이동">←</button>
        <button class="direction-button down" type="button" data-direction="down" aria-label="아래로 이동">↓</button>
        <button class="direction-button right" type="button" data-direction="right" aria-label="오른쪽으로 이동">→</button>
      </div>

      <p class="instructions">방향키 또는 아래 버튼으로 타일을 움직이세요. 같은 숫자를 합쳐 2048을 만들면 승리합니다.</p>

      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
        <div class="modal">
          <h2 id="modal-title"></h2>
          <p id="modal-message"></p>
          <div class="modal-actions">
            <button id="continue-game" class="secondary-button" type="button">계속하기</button>
            <button id="restart-game" class="primary-button" type="button">새 게임</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
